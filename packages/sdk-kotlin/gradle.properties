group=io.github.qasecret
# version is set from version.txt in the root build.gradle.kts so release-please
# can bump it cleanly without colliding with Java .properties syntax (where
# `#` is only a line-start comment marker, not an inline one).
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
