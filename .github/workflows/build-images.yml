name: build-images

# Per-app container build matrix. On PRs we build-only (no push, no scan)
# to catch broken Dockerfiles cheaply. On push to main + tag pushes we
# push to GHCR, run a Trivy CVE scan, sign with cosign (keyless OIDC),
# and emit a SPDX SBOM as a workflow artifact.
#
# Image naming: ghcr.io/qasecret/furan-<app>:<sha> always.
# Tag pushes add ghcr.io/qasecret/furan-<app>:<tag> + :latest.
#
# Why fail-fast=false: one shaky Dockerfile shouldn't kill the whole
# matrix. Each app builds independently.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard, capture-worker, diff-worker, integrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token: write is required for cosign keyless OIDC signing.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/qasecret/furan-{0}:{1}', matrix.app, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/qasecret/furan-{0}:latest', matrix.app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      # CVE scan only runs on push (PRs already need approval to merge).
      # exit-code=1 fails the job on CRITICAL/HIGH; ignore-unfixed avoids
      # CVEs without an upstream patch (otherwise base-image CVEs would
      # block every release until Debian rolls a new point release).
      - name: Trivy scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # Keyless signing via the workflow's OIDC token — no long-lived keys
      # in the repo. The transparency log entry on rekor.sigstore.dev pins
      # the signature to this workflow run.
      - name: Sign image (cosign keyless)
        if: github.event_name == 'push'
        run: cosign sign --yes ghcr.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}

      - name: Generate SBOM (syft → SPDX JSON)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.spdx.json
