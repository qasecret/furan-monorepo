name: build-images

# Per-app container build matrix. On PRs the `build-pr` job builds only (no
# push, no scan) to catch broken Dockerfiles cheaply, with a read-only token
# and no OIDC token. On push to main + tag pushes the `build` job (the only
# one granted packages: write + id-token: write) builds, runs a Trivy CVE
# scan, and ONLY THEN pushes to GHCR **and Docker
# Hub** (dual-publish for installer convenience), signs with cosign
# (keyless OIDC), and emits a SPDX SBOM as a workflow artifact. The scan
# precedes the push so a CVE failure can never leak an image (previously
# push came first, so a failed scan still published the vulnerable,
# unsigned image and clobbered `:latest`).
#
# Image naming (both registries):
#   <registry>/qasecret/furan-<app>:<sha>      always (on push)
#   <registry>/qasecret/furan-<app>:<tag>      on tag push
#   <registry>/qasecret/furan-<app>:latest     on tag push
# where <registry> ∈ {ghcr.io, docker.io}.
#
# workflow_dispatch is wired so a maintainer can re-fire the workflow
# against an existing tag (e.g. `gh workflow run build-images.yml --ref v1.0`)
# without having to push a new tag.
#
# Why fail-fast=false: one shaky Dockerfile shouldn't kill the whole
# matrix. Each app builds independently.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A release commit is both merged to main AND tagged, so `push: branches`
# and `push: tags` fire this workflow TWICE for the same commit — a wasteful
# double build/scan/push of all five images. Group both runs by commit SHA
# and let the TAG run win: it publishes :v<x.y.z> + :latest and (per the
# digest-signing fix) is the authoritative release build. cancel-in-progress
# is true ONLY for tag runs, so a tag push cancels the in-flight redundant
# main-push build; a main push never cancels a running tag build. Non-tagged
# main pushes and PRs have unique SHAs, so they get their own group and are
# unaffected (a PR's :sha build for the main-images overlay still runs).
concurrency:
  group: build-images-${{ github.sha }}
  cancel-in-progress: ${{ github.ref_type == 'tag' }}

# Least privilege by default; only the publishing `build` job widens it.
permissions:
  contents: read

jobs:
  # Publishing job: main pushes, tag pushes, workflow_dispatch — never PRs.
  # Job permissions can't be conditional on the event, so PRs run the
  # read-only `build-pr` job below instead of getting packages: write and an
  # OIDC token. Signing stays in THIS workflow file (not a reusable workflow)
  # because the keyless cert identity is the signing workflow's path, and
  # users verify against `build-images.yml@refs/tags/v<x.y.z>`.
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard, capture-worker, diff-worker, integrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token: write is required for cosign keyless OIDC signing.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # QEMU enables cross-arch builds. linux/arm64 layers are emulated on
      # the amd64 GitHub-hosted runner — slower than native, but spares
      # us a second runner pool. Switch to an arm64 runner matrix if the
      # build minutes start hurting.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # SCAN BEFORE PUSH. Build amd64 and `load` it into the runner's
      # docker so Trivy can scan the EXACT image before anything is
      # published. This ordering is the whole point of the gate: the
      # previous "build+push then scan" published the image first, so a
      # CVE failure still leaked the vulnerable (and unsigned, since
      # cosign ran after the scan) image to the registry and clobbered
      # `:latest`. OS-package CVEs (openssl, etc.) are arch-independent,
      # so the amd64 image is representative for the CVE gate. `build-pr`
      # runs this same build as the PR Dockerfile-builds check.
      - name: Build (amd64) for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: furan-scan/${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      # exit-code=1 fails the job on FIXED CRITICAL/HIGH before the push
      # step below ever runs; ignore-unfixed avoids blocking on CVEs with
      # no upstream patch. A failure here leaves the registry untouched.
      - name: Trivy scan (gate — before push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: furan-scan/${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Only reached when the scan passed. Multi-arch build + push; the
      # amd64 layers are a cache hit from the scan build above, so only
      # arm64 is built fresh here.
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}
            docker.io/qasecret/furan-${{ matrix.app }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/qasecret/furan-{0}:{1}', matrix.app, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/qasecret/furan-{0}:latest', matrix.app) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('docker.io/qasecret/furan-{0}:{1}', matrix.app, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('docker.io/qasecret/furan-{0}:latest', matrix.app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via the workflow's OIDC token — no long-lived keys
      # in the repo. The transparency log entry on rekor.sigstore.dev pins
      # the signature to this workflow run.
      #
      # Sign the immutable DIGEST this run just built+pushed, NOT the mutable
      # `:sha` tag. When two runs share a commit (a tag push and its
      # merge-to-main push both fire here) they each build a different digest
      # and both move the `:sha` tag; signing `:sha` then races and can attach
      # the signature to the other run's digest, leaving the tag a user pulls
      # (e.g. :v1.1.26) unsigned. `steps.build.outputs.digest` is the exact
      # manifest this run pushed, so the version/latest tags — which point at
      # this digest — are always covered.
      - name: Sign image (cosign keyless)
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/qasecret/furan-${APP}@${DIGEST}"

      # upload-release-assets: false stops anchore/sbom-action from trying
      # to attach the SBOM to the GitHub Release on tag pushes — that path
      # needs `contents: write` which the workflow does not grant, and the
      # SBOM is already preserved as a workflow artifact via the next step.
      - name: Generate SBOM (syft → SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/qasecret/furan-${{ matrix.app }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.spdx.json

      # ---- dashboard-only: single-origin (/api) image variant ----------------
      # The one-file furan-compose.yml fronts everything with nginx on ONE
      # origin, so its dashboard must bake NEXT_PUBLIC_API_URL=/api (relative)
      # instead of http://localhost:3000. Published as a SEPARATE `-proxy` tag
      # so the standard compose.yml / deploy.sh dashboard image is unchanged and
      # existing installs never regress. Tag releases only. The Trivy gate above
      # already vouched for the identical dashboard package surface (same
      # Dockerfile + deps; only the baked client-JS string differs), so this
      # reuses that clean bill rather than re-scanning.
      - name: Build and push dashboard-proxy (/api, multi-arch)
        id: build_proxy
        if: matrix.app == 'dashboard' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/qasecret/furan-dashboard:${{ github.ref_name }}-proxy
            ghcr.io/qasecret/furan-dashboard:latest-proxy
            docker.io/qasecret/furan-dashboard:${{ github.ref_name }}-proxy
            docker.io/qasecret/furan-dashboard:latest-proxy
          cache-from: type=gha,scope=dashboard

      - name: Sign dashboard-proxy (cosign keyless)
        if: matrix.app == 'dashboard' && startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build_proxy.outputs.digest }}
        run: cosign sign --yes "ghcr.io/qasecret/furan-dashboard@${DIGEST}"

  # PR runs: the Dockerfile-builds check only (amd64, no scan / push / sign —
  # unchanged from before), now with a read-only token and no OIDC token.
  # Same build inputs + gha cache scope as the `build` job's scan build, so
  # PRs reuse main's layer cache exactly as before.
  build-pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the `build` job's matrix above.
        app: [api, dashboard, capture-worker, diff-worker, integrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: furan-scan/${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
