name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast, dependency-free guard: the five furan service images in
  # infra/docker/compose.yml must all pin the SAME tag, so a chore(compose)
  # release PR can't ship a partially-bumped (drifted) stack. Runs in parallel
  # with the heavy job below.
  compose-image-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-compose-image-tags.mjs

  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: furan
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: furan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U furan -d furan_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://furan:cipw@localhost:5432/furan_ci
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: furan-ci
      S3_ACCESS_KEY: furan
      S3_SECRET_KEY: minio_ci_pw_long_enough # gitleaks:allow
      JWT_SECRET: "ci_jwt_secret_at_least_32_chars_long_for_test" # gitleaks:allow
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Start MinIO + create bucket
        # services: block can't pass server args to the official minio image,
        # so we start it manually here. Bitnami's auto-bucket image had a
        # broken `:latest` tag at PR time.
        #
        # Pull from docker.io (the install-path registry) rather than
        # quay.io — quay has had recurring 504 outages that block CI without
        # touching any code. MinIO publishes identical images to both.
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=furan \
            -e MINIO_ROOT_PASSWORD=minio_ci_pw_long_enough \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "minio ready"
              break
            fi
            echo "waiting for minio... ($i/30)"
            sleep 2
          done
          docker run --rm --network host \
            -e MC_HOST_local=http://furan:minio_ci_pw_long_enough@localhost:9000 \
            minio/mc:latest mb local/furan-ci
      - name: Apply migrations
        run: pnpm --filter @furan/db exec drizzle-kit migrate
      - name: Install Playwright browsers (capture-worker integration test)
        # apps/capture-worker spawns chromium for its integration test. The
        # ubuntu-latest runner has the OS deps preinstalled; only browser
        # binaries need to land. --with-deps is a no-op on hosted runners but
        # documents intent.
        run: pnpm --filter @furan/capture-worker exec playwright install --with-deps chromium
      - name: Turbo affected lint + typecheck
        run: pnpm turbo run lint typecheck --filter=...[origin/main]
      - name: Turbo affected test (serialized — workers + api share the same Postgres)
        # Integration tests across apps/api, apps/capture-worker, apps/diff-worker, packages/db
        # all hit the same compose Postgres. Parallel test runs across packages race on
        # cleanup (api tests truncate `test_runs` / `projects` while worker tests are
        # mid-handler). Serialize the test stage. Lint + typecheck stay parallel above.
        run: pnpm turbo run test --filter=...[origin/main] --concurrency=1
      - name: Turbo affected build
        run: pnpm turbo run build --filter=...[origin/main]
