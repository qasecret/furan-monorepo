name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: furan
          POSTGRES_PASSWORD: cipw
          POSTGRES_DB: furan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U furan -d furan_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: furan
          MINIO_ROOT_PASSWORD: minio_ci_pw_long_enough
          MINIO_DEFAULT_BUCKETS: furan-ci
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://furan:cipw@localhost:5432/furan_ci
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: furan-ci
      S3_ACCESS_KEY: furan
      S3_SECRET_KEY: minio_ci_pw_long_enough # gitleaks:allow
      JWT_SECRET: "ci_jwt_secret_at_least_32_chars_long_for_test" # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm --filter @furan/db exec drizzle-kit migrate
      - name: Turbo affected lint + typecheck + test
        run: pnpm turbo run lint typecheck test --filter=...[origin/main]
      - name: Turbo affected build
        run: pnpm turbo run build --filter=...[origin/main]
