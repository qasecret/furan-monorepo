name: sdk-e2e
# Early-warning CI for the Kotlin SDK + downstream example.
#
# v0.5 scope: build the SDK, publish artifacts to mavenLocal, then compile
# the standalone example project against them. This catches "SDK source
# broke" and "example no longer resolves" regressions on every PR that
# touches the SDK or any of the apps/packages that feed it.
#
# A full end-to-end run (example test → apps/api → diff worker → assert
# test_runs row) is deferred to a follow-up — it requires a deterministic
# seed-admin + mint-token + create-project flow that doesn't exist as a
# single script today. The TODO at the bottom of this file marks where
# that wiring lands once available.

on:
  pull_request:
    paths:
      - "packages/sdk-kotlin/**"
      - "apps/api/**"
      - "apps/capture-worker/**"
      - "apps/diff-worker/**"
      - "packages/queue/**"
      - "packages/db/**"
      - ".github/workflows/sdk-e2e.yml"
  push:
    branches: [main]
    paths:
      - "packages/sdk-kotlin/**"
      - ".github/workflows/sdk-e2e.yml"

jobs:
  sdk-build-and-example-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build + publish SDK to mavenLocal
        working-directory: packages/sdk-kotlin
        run: ./gradlew :core:publishToMavenLocal :selenium:publishToMavenLocal --no-daemon
      - name: Compile example project against mavenLocal SDK
        working-directory: packages/sdk-kotlin/examples/sdk-selenium-junit5
        # `testClasses` compiles the test sources without executing them.
        # The example's CheckoutTest is gated on FURAN_API_URL, so a plain
        # `test` invocation skips silently — `testClasses` proves the SDK
        # API surface still satisfies the example.
        run: ../../gradlew -p . testClasses --no-daemon

