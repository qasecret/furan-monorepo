name: release

on:
  push:
    tags: ["sdk/v*"]

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # reserved for future OIDC namespace verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - name: Publish sdk-core + sdk-selenium to Maven Central
        # The vanniktech plugin reads ORG_GRADLE_PROJECT_* env vars by convention;
        # docs/runbooks/maven-central-publish.md documents the full secret list.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        working-directory: packages/sdk-kotlin
        # publishToMavenCentral uploads + stages but does NOT release —
        # `automaticRelease = false` in build.gradle.kts means a maintainer must
        # promote from the Portal UI after reviewing the staged artifact.
        # (publishAndReleaseToMavenCentral would force-release regardless.)
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
