name: publish

# Triggered by release-please when a Release PR is merged and the
# `sdk/v<version>` tag is created. The vanniktech plugin's
# `automaticRelease = true` setting in core/build.gradle.kts +
# selenium/build.gradle.kts means publishToMavenCentral here stages AND
# auto-releases to Maven Central in one step — no Portal click.
# See docs/runbooks/maven-central-publish.md "Release flow".

on:
  push:
    tags: ["sdk/v*"]

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # reserved for future OIDC namespace verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - name: Publish furan-core + furan-selenium to Maven Central
        # The vanniktech plugin reads ORG_GRADLE_PROJECT_* env vars by convention;
        # docs/runbooks/maven-central-publish.md documents the full secret list.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        working-directory: packages/sdk-kotlin
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
