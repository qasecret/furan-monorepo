name: visual-regression
on:
  pull_request:
    branches: [main]

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run visual tests
        env:
          FURAN_API_URL: ${{ secrets.FURAN_API_URL }}
          FURAN_API_TOKEN: ${{ secrets.FURAN_API_TOKEN }}
          FURAN_PROJECT_ID: ${{ secrets.FURAN_PROJECT_ID }}
          FURAN_CI_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FURAN_BRANCH: ${{ github.head_ref || github.ref_name }}
          FURAN_PARENT_BRANCH: ${{ github.base_ref }}
        run: ./gradlew test --tests "*VisualTest*"

  # A JS project: run the tests that write PNGs, then upload them. Each folder
  # under screenshots/ becomes a test; the job fails when one needs review.
  visual-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Run tests that write screenshots/
        run: npx playwright test
      - uses: qasecret/furan-monorepo/packages/cli@cli/v0.1.0
        with:
          path: screenshots
          api-url: ${{ secrets.FURAN_API_URL }}
          token: ${{ secrets.FURAN_API_TOKEN }}
          project-id: ${{ secrets.FURAN_PROJECT_ID }}
