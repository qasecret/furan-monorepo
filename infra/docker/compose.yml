# Furan base compose stack — the documented `docker compose up -d`
# install path. Data plane (postgres/redis/minio) is internal-only; the
# `api` and `dashboard` services expose 3000/3001 on the host so the
# install README's "browse to <http://localhost:3001>" step works without
# an additional overlay. Front with a reverse proxy in real deployments.
# Dev workflow adds `compose.dev.yml` for host ports on the data plane.
# Phase 5 v1.0: app services pull from Docker Hub (docker.io/qasecret/furan-*)
# pinned to :v1.0. GHCR mirror images at ghcr.io/qasecret/furan-*:v1.0 are
# also published by the build-images.yml workflow for users who prefer GHCR
# (signed via cosign keyless, scanned via Trivy, SBOM available as a workflow
# artifact). Bumping versions is a single tag-replace per service.
#
# Storage modes (legacy parity with `STATIC_SERVICE`):
#   - S3 (default): `COMPOSE_PROFILES=s3` in `.env`. MinIO runs as the
#     object store; apps read S3_* envs.
#   - HDD: `COMPOSE_PROFILES=hdd` in `.env` + `STORAGE_KIND=hdd` +
#     `HDD_ROOT=/var/lib/furan/storage`. MinIO is NOT started; each app
#     reads/writes the shared `furan_hdd_data` volume.
# Detailed comparison and migration steps in docs/runbooks/storage-backends.md.
# .env.example sets `COMPOSE_PROFILES=s3` so a fresh install matches the
# pre-HDD behavior byte-for-byte. Existing installs whose `.env` predates
# this change must add the same line — see the runbook.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    # `profiles: [s3]` gates the MinIO service behind `COMPOSE_PROFILES=s3`
    # so HDD-mode installs (`COMPOSE_PROFILES=hdd`) skip it entirely.
    # Fresh installs ship with `COMPOSE_PROFILES=s3` in .env.example so
    # the default path is unchanged.
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/${MINIO_BUCKET}
        mc anonymous set download local/${MINIO_BUCKET} || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

  # ----- App services ---------------------------------------------------
  # All five pull pre-built images from Docker Hub. To use the GHCR mirror
  # instead, swap `docker.io/` for `ghcr.io/` (you'll need a GH PAT with
  # read:packages scope if the GHCR packages are private). Use
  # `compose.dev.yml` to expose host ports.
  api:
    image: docker.io/qasecret/furan-api:v1.1.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
        # `required: false` lets the api start under HDD mode where
        # MinIO is not in the running set (its profile is `s3`). When
        # MinIO IS running (S3 mode), the healthcheck still gates boot
        # so the first S3 op does not race minio-init's bucket create.
        required: false
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Storage backend selector — see @furan/storage. `s3` (default)
      # uses MinIO via S3_*; `hdd` writes to HDD_ROOT on the shared
      # volume below. Unused fields are ignored by the env validator.
      STORAGE_KIND: ${STORAGE_KIND:-s3}
      HDD_ROOT: ${HDD_ROOT:-/var/lib/furan/storage}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      # Optional first-admin bootstrap (see .env.example). Forwarded so
      # the api can seed an admin row when the users table is empty.
      FURAN_BOOTSTRAP_ADMIN_EMAIL: ${FURAN_BOOTSTRAP_ADMIN_EMAIL:-}
      FURAN_BOOTSTRAP_ADMIN_PASSWORD: ${FURAN_BOOTSTRAP_ADMIN_PASSWORD:-}
      # CORS allowlist for the dashboard's browser-side calls. The dashboard
      # is on :3001 while the api is on :3000, so cross-origin preflights
      # need an explicit allow. Override (comma-separated) when serving the
      # dashboard from a different origin, e.g. https://furan.example.com.
      FURAN_DASHBOARD_ORIGIN: ${FURAN_DASHBOARD_ORIGIN:-http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Shared HDD-storage mount. Empty + unused in S3 mode (the volume
      # still exists but nothing writes to it); the capture-worker
      # writes screenshots and the api/diff-worker read them under HDD.
      # The mount point matches the HDD_ROOT default above.
      - furan_hdd_data:/var/lib/furan/storage
    restart: unless-stopped

  capture-worker:
    image: docker.io/qasecret/furan-capture-worker:v1.1.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_KIND: ${STORAGE_KIND:-s3}
      HDD_ROOT: ${HDD_ROOT:-/var/lib/furan/storage}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - furan_hdd_data:/var/lib/furan/storage
    restart: unless-stopped

  diff-worker:
    image: docker.io/qasecret/furan-diff-worker:v1.1.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_KIND: ${STORAGE_KIND:-s3}
      HDD_ROOT: ${HDD_ROOT:-/var/lib/furan/storage}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - furan_hdd_data:/var/lib/furan/storage
    restart: unless-stopped

  integrations:
    image: docker.io/qasecret/furan-integrations:v1.1.10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      INTEGRATIONS_PORT: 3400
      HEALTH_PORT: 3300
      # GitHub App + Slack creds are optional in T11; set in .env to enable.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  dashboard:
    image: docker.io/qasecret/furan-dashboard:v1.1.10
    depends_on:
      - api
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production
      # Default to the in-network api hostname so the dashboard's Server
      # Actions / SSR fetches resolve from inside the compose network. The
      # browser bundle gets http://localhost:3000 baked at build time via
      # zod's default in apps/dashboard/src/lib/env.ts, which is what the
      # host browser needs to reach the host-port-mapped api container.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3000}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # Shared filesystem-storage volume used when STORAGE_KIND=hdd. Mounted
  # at /var/lib/furan/storage on the api, capture-worker, and
  # diff-worker so screenshots written by capture are readable by diff.
  # In S3 mode this volume still exists (compose creates it on first
  # `up`) but no service writes to it — a couple of inodes' worth.
  # See docs/runbooks/storage-backends.md for backup considerations.
  furan_hdd_data:
