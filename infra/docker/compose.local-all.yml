# From-HEAD overlay — never released. Points all 5 app services at images built
# from the current checkout (tag :local) instead of the published images pinned
# in compose.yml. Loaded by `deploy.sh --mode from-head` and by the e2e suite
# (e2e/scripts/compose.ts), so it is committed: a clean checkout needs it.
#
# Build first (from repo root):
#   for app in api capture-worker diff-worker integrations dashboard; do
#     DOCKER_BUILDKIT=1 docker build -f apps/$app/Dockerfile -t qasecret/furan-$app:local . || break
#   done
#
# Run:
#   docker compose -p docker --env-file infra/docker/.env \
#     -f infra/docker/compose.yml -f infra/docker/compose.local-all.yml up -d
services:
  api:
    image: qasecret/furan-api:local
  capture-worker:
    image: qasecret/furan-capture-worker:local
  diff-worker:
    image: qasecret/furan-diff-worker:local
  integrations:
    image: qasecret/furan-integrations:local
  dashboard:
    image: qasecret/furan-dashboard:local
